<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duff Quest: copy itch description</title>
<style>
body{margin:0;background:#1e1220;color:#fff1d6;font:16px/1.5 system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.note{color:#cbb;font-size:14px}
button{width:100%;padding:18px;border:0;border-radius:999px;background:#2fb3a8;color:#fff;font:800 20px system-ui;margin:12px 0}
ol{padding-left:20px}li{margin:4px 0}
textarea{width:100%;height:140px;background:#17141f;color:#cfc;border:1px solid #3a2c48;border-radius:8px;font:12px monospace}
.prev{background:#2a1e36;border-radius:10px;padding:14px;margin-top:16px}.prev img{width:100%;border-radius:6px}
.prev h2{color:#f2b63c}.prev a{color:#ff6f91}
</style></head><body><main>
<h1>Duff Quest: itch description</h1>
<p class="note" id="stamp">Loading the latest version...</p>
<button id="copy" disabled>Copy HTML</button>
<p class="note" id="msg"></p>
<ol><li>itch.io &gt; Dashboard &gt; Duff Quest &gt; <b>Edit game</b></li>
<li>Description box: tap <b>&lt;/&gt;</b>, select all, delete, paste</li>
<li>Tap &lt;/&gt; again, then <b>Save</b></li></ol>
<textarea id="src" readonly></textarea>
<div class="prev" id="prev"></div>
</main><script>
const src=document.getElementById('src'),btn=document.getElementById('copy'),msg=document.getElementById('msg');
fetch('page.html?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw r.status;return r.text()}).then(t=>{
  src.value=t;document.getElementById('prev').innerHTML=t;btn.disabled=false;
  document.getElementById('stamp').textContent='Latest from main ('+t.length+' characters). Footage updates by itself; paste only when the text changed.';
}).catch(e=>{document.getElementById('stamp').textContent='Could not load page.html ('+e+'). Try again in a minute.'});
btn.onclick=async()=>{try{await navigator.clipboard.writeText(src.value);msg.textContent='Copied. Paste it in itch (</> view).'}
catch(e){src.focus();src.select();msg.textContent='Copy blocked: the text box is selected, long-press > Copy.'}};
</script></body></html>
