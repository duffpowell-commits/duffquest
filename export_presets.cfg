[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*, *.json, *.txt"
exclude_filter="tools/*, docs/*, duffquesthd/*, grok_art/*, .env, .env.*, assets/art/ch_*, assets/art/portraits_hd/*, assets/art/kf_*, assets/art/kp_*, assets/art/arena_*, assets/art/duff_*, assets/art/gala*, assets/art/home_*, assets/art/bg_kitchen*, assets/art/ground_painted*, assets/art/loading/*, assets/audio/mus_*, assets/sfx/ko/*, assets/art/ko/*, assets/art/boss_intro/*, assets/art/loading/brunch_atlas.jpg*, assets/art/loading/fryer_nap.jpg*, assets/art/loading/goose_bet.jpg*, assets/art/loading/gym_spot.jpg*, assets/art/loading/octavia_fund.jpg*, assets/art/loading/omaha_winter.jpg*, assets/art/loading/one_trip.jpg*, assets/art/loading/plasma_day.jpg*, assets/art/loading/raccoon_break.jpg*, assets/art/loading/regular_5am.jpg*, assets/art/loading/waffle_showoff.jpg*, assets/art/loading/witnesses.jpg*, assets/art/bg_akarui.png*, assets/art/bg_bedroom.png*, assets/art/bg_grocery.png*, assets/art/bg_holland.png*, assets/art/bg_kwik.png*, assets/art/bg_living_night.png*, assets/art/bg_nursery.png*, assets/art/bg_pharmacy.png*, assets/art/bg_plasma.png*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script>/* Duff Quest: fetch the engine pre-gzipped (index.wasm.gz, ~9 MB instead of 38 MB) and unzip it in the browser. Falls back to plain index.wasm on old browsers or any error. CI writes the .gz (build.yml). */(function(){if(typeof DecompressionStream==='undefined')return;var f=window.fetch.bind(window);window.fetch=function(u,o){var s=typeof u==='string'?u:(u&&u.url)||'';if(!/index\\.wasm(\\?|$)/.test(s))return f(u,o);return f(s.replace(/index\\.wasm/,'index.wasm.gz'),o).then(function(r){if(!r.ok)return f(u,o);var enc=(r.headers.get('Content-Encoding')||'').toLowerCase();var body=enc.indexOf('gzip')>=0?r.body:r.body.pipeThrough(new DecompressionStream('gzip'));window.__dq_wasm_gz=true;return new Response(body,{status:200,headers:{'Content-Type':'application/wasm'}});}).catch(function(){return f(u,o);});};})();</script>"
progressive_web_app/enabled=false

