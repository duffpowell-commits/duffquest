name: web template (3D view)
# Builds the trimmed web export template WITH 3D rendering from tools/web_template_3d/custom.py and publishes it
# to "web-template-3d" (main) or "web-template-3d-preview" (branches). Nothing ships with it yet: build.yml still
# uses web-template-2d. Step 1 of spike3d/PLAN_3D.md (measure size + boot). ~30 min.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/web_template_3d/custom.py
      - .github/workflows/web_template_3d.yml

env:
  GODOT_TAG: 4.7.2-stable
  EM_VERSION: 4.0.11

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_TAG }}
          path: godot
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true
      - name: Build template
        run: |
          pip install scons
          cd godot
          scons platform=web target=template_release threads=no profile=../tools/web_template_3d/custom.py -j$(nproc)
          ls -la bin
      - name: Publish (main -> "web-template-3d", other branches -> "web-template-3d-preview")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=web-template-3d; [ "$GITHUB_REF" = refs/heads/main ] || tag=web-template-3d-preview
          cp godot/bin/godot.web.template_release.wasm32.nothreads.zip web_nothreads_release.zip
          gh release view $tag >/dev/null 2>&1 || gh release create $tag --prerelease \
            --title "Web export template (3D view, trimmed) $tag" --notes "Built by .github/workflows/web_template.yml."
          gh release upload $tag web_nothreads_release.zip --clobber
          gh release edit $tag --notes "Godot ${GODOT_TAG}, tools/web_template_3d/custom.py at ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
      - uses: actions/upload-artifact@v4
        with:
          name: web-template-3d
          path: godot/bin/godot.web.template_release.wasm32.nothreads.zip
