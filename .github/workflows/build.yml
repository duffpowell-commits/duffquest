name: build

# Every push: parse all scripts, run the rule tests, then export a web build (for iPhone
# testers via Safari / itch) and a debug APK (for Android). Download both from the run's
# "Artifacts" box on GitHub; the phone can open them straight from the GitHub app/site.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import || true
      - name: Parse every script
        # A parse error makes a scene hang instead of failing, so check them all.
        run: |
          fail=0
          for f in $(git ls-files '*.gd' | grep -v '^tools/recovery/'); do
            if godot --headless --path . --check-only --script "$f" 2>&1 | grep -E "Parse Error|SCRIPT ERROR"; then
              echo "::error file=$f::parse error"; fail=1
            fi
          done
          exit $fail
      - name: Smoke test (boot, new game, walk, phone)
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a godot --path . --rendering-driver opengl3 res://tools/smoke.tscn --fixed-fps 30 --quit-after 600 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log

  export:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
      - name: Use the trimmed 2D web template when it exists (web_template.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # branches test the preview build first (web_template.yml publishes there off main)
          tags=web-template-2d; [ "$GITHUB_REF" = refs/heads/main ] || tags="web-template-2d-preview web-template-2d"
          for t in $tags; do gh release download $t -p web_nothreads_release.zip -D /tmp/wt 2>/dev/null && echo "template: $t" && break; done
          if [ -f /tmp/wt/web_nothreads_release.zip ]; then
            cp /tmp/wt/web_nothreads_release.zip ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}/web_nothreads_release.zip
            echo "using the trimmed 2D web template"
          else
            echo "no web-template-2d release yet: stock web template"
          fi
      - name: Android SDK paths + debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<TRES
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          cp ~/.config/godot/editor_settings-4.5.tres ~/.config/godot/editor_settings-4.tres
      - name: Import
        run: godot --headless --path . --import || true
      - name: Export web
        run: |
          mkdir -p build/web && touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
          # second pack: the art the Web preset leaves out of index.pck; game streams it after boot (extra_pack.gd)
          godot --headless --path . --script tools/make_extra_pack.gd -- build/web/world.pck world
          godot --headless --path . --script tools/make_extra_pack.gd -- build/web/extra.pck late
          test -s build/web/world.pck
          test -s build/web/extra.pck
          # pre-gzipped engine: index.html unzips it in the browser (export_presets.cfg html/head_include)
          gzip -9 -k -n build/web/index.wasm
          ls -la build/web
      - name: Export web as a home-screen app (GitHub Pages)
        # Same game, exported with the PWA switched on so iPhone players can Share -> Add to Home Screen
        # and launch it full screen with no Safari bars (iPhone Safari has no fullscreen API for games,
        # and itch's iframe can't be installed). Only this copy gets the service worker; itch is untouched.
        run: |
          cp export_presets.cfg /tmp/presets.bak
          sed -i '0,/progressive_web_app\/enabled=false/s//progressive_web_app\/enabled=true\nprogressive_web_app\/display=1\nprogressive_web_app\/orientation=1\nprogressive_web_app\/background_color=Color(0, 0, 0, 1)/' export_presets.cfg
          mkdir -p build/pages
          godot --headless --path . --export-release "Web" build/pages/index.html
          cp /tmp/presets.bak export_presets.cfg
          cp build/web/world.pck build/web/extra.pck build/pages/
          gzip -9 -k -n build/pages/index.wasm
          # iOS reads these from the page, not only the manifest
          sed -i 's#<head>#<head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Duff Quest">#' build/pages/index.html
          sed -i 's#<meta name="viewport" content="#<meta name="viewport" content="viewport-fit=cover, #' build/pages/index.html
          touch build/pages/.nojekyll
          ls -la build/pages
          grep -o '<head>.\{0,400\}' build/pages/index.html | head -c 600; echo
          test -s build/pages/index.manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Export Android (debug APK)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/duffquest.apk 2>&1 | tee export.log
          grep -A8 "configuration errors" export.log || true
          test -f build/android/duffquest.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: duffquest-web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: duffquest-apk
          path: build/android/duffquest.apk
      - name: Publish to the "dev" release (main only)
        # One fixed release Duff can open on his phone: Releases -> dev -> tap the APK.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/web && zip -qr ../duffquest-web.zip .)
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Latest dev build" --notes "Rebuilt on every push to main."
          gh release upload dev build/android/duffquest.apk build/duffquest-web.zip --clobber
          gh release edit dev --notes "Rebuilt on every push to main. Last: ${GITHUB_SHA::7}"
      - name: Publish a branch preview of the web build (pushes off main)
        # So a session can boot-test a branch on throttled 4G (artifact storage is not reachable from sessions).
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/web && zip -qr ../duffquest-web-preview.zip .)
          gh release view web-preview >/dev/null 2>&1 || gh release create web-preview --prerelease --title "Branch web preview" --notes "Not for players."
          gh release upload web-preview build/duffquest-web-preview.zip --clobber
          gh release edit web-preview --notes "Not for players. ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
      - name: Upload web build to itch.io (main only)
        # Finds the itch project by title ("duff"), so no URL has to live in this file.
        # The project must exist on itch first (kind HTML). Needs repo secret BUTLER_API_KEY.
        if: github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::warning::BUTLER_API_KEY secret not set, skipping itch upload"; exit 0; fi
          games=$(curl -sf "https://itch.io/api/1/$BUTLER_API_KEY/my-games") || { echo "::error::itch API rejected the key"; exit 1; }
          echo "$games" | jq -r '.games[] | "itch project: \(.title) -> \(.url)"'
          url=$(echo "$games" | jq -r '[.games[] | select(.title | test("duff"; "i"))][0].url // empty')
          if [ -z "$url" ]; then echo "::error::No itch project with 'duff' in the title. Create it on itch (kind: HTML) first."; exit 1; fi
          target=$(echo "$url" | sed -E 's#https?://([^.]+)\.itch\.io/([^/]+).*#\1/\2#')
          echo "Pushing to $target:html"
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -qo butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/web "$target:html" --userversion "${GITHUB_SHA::7}"
          ./butler/butler status "$target:html"

  pages:
    # Publishes the home-screen web build to https://duffpowell-commits.github.io/duffquest/
    # One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions". Until then this job
    # fails softly and nothing else is affected.
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
